name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test
        shell: pwsh
        run: .\tests\smoke-tests.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AndroidDisplayVoiceBridge
          path: artifacts/app/
