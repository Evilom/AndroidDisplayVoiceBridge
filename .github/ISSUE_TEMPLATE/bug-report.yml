name: Bug 报告
description: 报告已支持设备或 Windows 桥接程序的问题
title: "[Bug] 简短描述"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请先阅读 docs/troubleshooting.md，并对日志做脱敏。
  - type: input
    id: version
    attributes:
      label: 项目版本
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows、显示器与固件
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已经移除 IP、设备 serial、账号、密钥、令牌和个人语音内容
          required: true
